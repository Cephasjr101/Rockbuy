<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sabi Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--paper:#f6f7f9;--line:#d9dde5;--go:#0b7a4b;--sun:#f2a900;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;gap:12px;align-items:center;padding:12px 16px}
header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
header input{flex:1;min-width:0;padding:10px 12px;border:0;border-radius:8px;font:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 14px;font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.cartbtn{background:var(--sun);color:var(--ink)}
.go{background:var(--go);color:#fff;width:100%;padding:14px}
main{max-width:1100px;margin:0 auto;padding:16px}
.banner{background:#fff;border-left:6px solid var(--go);padding:12px 16px;margin-bottom:16px;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.img{aspect-ratio:1;background:#e7eaf0 center/cover}
.item div.b{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.item h3{margin:0;font-size:14px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-weight:800;font-size:18px;margin-top:auto}
.item button{background:var(--ink);color:#fff}
#cart{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:#fff;box-shadow:-8px 0 24px rgba(0,0,0,.2);transform:translateX(100%);transition:transform .2s;z-index:10;display:flex;flex-direction:column}
#cart.open{transform:none}
#cart .in{padding:16px;overflow:auto;flex:1}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row small{display:block;color:#5b6478}
label{display:block;font-weight:600;margin-top:10px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}
.err{color:#b00020;margin:8px 0}
.empty{padding:40px 0;text-align:center;color:#5b6478}
@media (prefers-reduced-motion:reduce){#cart{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Sabi Shop</h1>
  <input id="q" type="search" placeholder="Search products" aria-label="Search products">
  <button class="cartbtn" id="open">Cart (<span id="n">0</span>)</button>
</header>
<main>
  <div id="track"></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No products yet. Import some from the admin page.</p>
</main>

<aside id="cart" aria-label="Your cart">
  <div class="in">
    <button id="close" style="float:right;background:#e7eaf0">Close</button>
    <h2>Your cart</h2>
    <div id="lines"></div>
    <div class="row"><b>Total</b><b id="sub">0</b></div>
    <small>Delivery fee is added at payment.</small>
    <h3>Delivery details</h3>
    <label>Full name<input id="name" autocomplete="name"></label>
    <label>Phone (for the rider)<input id="phone" type="tel" autocomplete="tel"></label>
    <label>Email (for your receipt)<input id="email" type="email" autocomplete="email"></label>
    <label>Town or city<input id="city"></label>
    <label>Delivery address or landmark<textarea id="address" rows="2"></textarea></label>
    <div class="err" id="err" role="alert"></div>
    <button class="go" id="pay">Pay with card or mobile money</button>
  </div>
</aside>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cur = 'GHS', products = {}, cart = JSON.parse(localStorage.getItem('cart') || '{}');
const money = n => `${cur} ${Number(n).toLocaleString()}`;
const save = () => { localStorage.setItem('cart', JSON.stringify(cart)); drawCart(); };

async function load(q = '') {
  const j = await (await fetch('/api/products?q=' + encodeURIComponent(q))).json();
  cur = j.currency; products = {};
  j.items.forEach(p => products[p.id] = p);
  $('empty').hidden = j.items.length > 0;
  $('grid').innerHTML = j.items.map(p => `
    <div class="item">
      <div class="img" style="${/^https?:/.test(p.image) ? `background-image:url('${encodeURI(p.image)}')` : ''}"></div>
      <div class="b"><h3>${esc(p.title)}</h3><div class="price">${money(p.price)}</div>
      <button data-id="${p.id}">Add to cart</button></div>
    </div>`).join('');
  drawCart();
}

function drawCart() {
  const ids = Object.keys(cart).filter(id => products[id]);
  let sub = 0, count = 0;
  $('lines').innerHTML = ids.length ? ids.map(id => {
    const p = products[id], q = cart[id]; sub += p.price * q; count += q;
    return `<div class="row"><div>${esc(p.title)}<small>${money(p.price)} each</small></div>
      <div><button data-dec="${id}">-</button> ${q} <button data-inc="${id}">+</button></div></div>`;
  }).join('') : '<p class="empty">Your cart is empty.</p>';
  $('sub').textContent = money(sub); $('n').textContent = count;
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.dataset.id) { cart[t.dataset.id] = (cart[t.dataset.id] || 0) + 1; save(); $('cart').classList.add('open'); }
  if (t.dataset.inc) { cart[t.dataset.inc]++; save(); }
  if (t.dataset.dec) { if (--cart[t.dataset.dec] <= 0) delete cart[t.dataset.dec]; save(); }
});
$('open').onclick = () => $('cart').classList.add('open');
$('close').onclick = () => $('cart').classList.remove('open');
let t; $('q').oninput = e => { clearTimeout(t); t = setTimeout(() => load(e.target.value), 300); };

$('pay').onclick = async () => {
  $('err').textContent = '';
  const items = Object.entries(cart).map(([id, qty]) => ({ id: +id, qty }));
  if (!items.length) { $('err').textContent = 'Add something to your cart first.'; return; }
  $('pay').disabled = true; $('pay').textContent = 'Starting payment...';
  const body = { items, name: $('name').value, phone: $('phone').value, email: $('email').value, city: $('city').value, address: $('address').value };
  const r = await fetch('/api/checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (j.url) { localStorage.removeItem('cart'); location.href = j.url; return; }
  $('err').textContent = j.error || 'Something went wrong. Try again.';
  $('pay').disabled = false; $('pay').textContent = 'Pay with card or mobile money';
};

async function track() {
  const ref = new URLSearchParams(location.search).get('ref');
  if (!ref) return;
  const r = await fetch('/api/orders/' + encodeURIComponent(ref));
  if (!r.ok) return;
  const o = await r.json();
  const label = { pending: 'Waiting for payment', paid: 'Paid. We are buying your items', purchased: 'Bought from the supplier', shipped: 'On the way to Africa', out_for_delivery: 'Out for delivery', delivered: 'Delivered', cancelled: 'Cancelled' }[o.status];
  $('track').innerHTML = `<div class="banner"><b>Order ${esc(o.ref)}</b>: ${esc(label)}<br>Total ${o.currency} ${o.total.toLocaleString()}</div>`;
}
load().then(track);
</script>
</body>
</html>
