# fly.toml app configuration file generated for rockbuy on 2026-10-28T15:24:42Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'rockbuy'
primary_region = 'ams'

[http_service]
  auto_start_machines = true
  auto_stop_machines = 'stop'
  force_https = true
  internal_port = 8080
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'
  auto_extend_size_threshold = 80
  destination = '/data'
  source = 'data'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 2048
